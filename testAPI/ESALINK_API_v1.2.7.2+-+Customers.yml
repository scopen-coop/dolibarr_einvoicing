servers:
  - url: https://ppd.hubtimize.fr/api/orchestrator/
    description: Test environment
  - url: https://hubtimize.fr/api/orchestrator/
    description: Production environment (not ready)
paths:
  /v1/token:
    post:
      tags:
        - API Token
      operationId: token
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenRequestDto'
        required: true
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/AccessTokenResponse'
  /v1/oauth2/token:
    post:
      tags:
        - API Token
      operationId: oauthToken
      security:
        - basicAuth: []   # Mode 1 : credentials dans l'en-tête
        - {}              # Mode 2 : credentials dans le body
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: "#/components/schemas/OAuthTokenRequest"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccessTokenResponse"
  /v1/healthcheck:
    get:
      tags:
        - Supervisor
      summary: Check whether the API service is up and running.
      operationId: getHealth
      parameters:
        - name: Request-Id
          in: header
          description: Header parameter used to correlate logs from several components
          required: false
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: OK - Operation succeeded
        '500':
          description: 'Error 500 : Server Internal Error.'
          content:
            application/json:
              example:
                errorCode: INTERNAL_ERROR
                errorMessage: null
        '503':
          description: 'Error 503 : Unavailable Resource.'
          content:
            application/json:
              example:
                errorCode: RESOURCE_ERROR
                errorMessage: null
